<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owl figure preview</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;background:#09080c;display:grid;grid-template-columns:1fr 1fr;gap:4px}model-viewer{width:100%;height:48vh;background:#110f17}</style>
<model-viewer id="a" src="../assets/models/owl-figure.glb" camera-orbit="0deg 80deg auto" exposure="1" environment-image="neutral" shadow-intensity="1"></model-viewer>
<model-viewer src="../assets/models/owl-figure.glb" camera-orbit="90deg 80deg auto" exposure="1" environment-image="neutral"></model-viewer>
<model-viewer src="../assets/models/owl-figure.glb" camera-orbit="180deg 80deg auto" exposure="1" environment-image="neutral"></model-viewer>
<model-viewer src="../assets/models/owl-figure.glb" camera-orbit="0deg 80deg auto" exposure="0.7" environment-image="neutral" style="filter:saturate(.8)"></model-viewer>
