name: Перевірка проєктів

on:
  push:
    paths: ["data/projects.json", "projects/img/**", "_build/validate_projects.py"]
  pull_request:
    paths: ["data/projects.json", "projects/img/**", "_build/validate_projects.py"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Перевірити data/projects.json
        run: python3 _build/validate_projects.py
